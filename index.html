  const [{ data: employes }, { data: notesFrais }] = await Promise.all([
    sb.from('employes').select('*').eq('entreprise_id', state.entreprise.id).eq('actif', true).order('nom'),
    sb.from('notes_frais').select('*').eq('entreprise_id', state.entreprise.id).order('date', { ascending:false }),
  ]);

  main.innerHTML = `
    <div class="view-head"><div><h1>Compta</h1><div class="view-sub">Export pour le comptable, récap TVA, notes de frais.</div></div></div>
    <div class="card">
      <h3>Période</h3>
      <div class="form-grid">
        <div class="field"><label>Du</label><input id="compta-debut" type="date" value="${state.comptaDebut}"></div>
        <div class="field"><label>Au</label><input id="compta-fin" type="date" value="${state.comptaFin}"></div>
        <div class="field"><button class="btn btn-ghost" id="compta-refresh" type="button">Appliquer</button></div>
      </div>
    </div>
    <div class="card">
      <h3>Export comptable</h3>
      <div class="view-sub" style="margin-bottom:10px">CSV (séparateur « ; », nombres avec virgule) — à transmettre à ton comptable.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="export-ventes" type="button">Exporter les ventes</button>
        <button class="btn btn-ghost" id="export-achats" type="button">Exporter les achats</button>
      </div>
    </div>
    <div class="card" id="tva-card"><h3>Récap TVA</h3><div class="view-sub">Calcul…</div></div>
    <div class="card">
      <div class="card-row"><h3 style="margin:0">Notes de frais</h3><button class="btn btn-ghost btn-sm btn-new" id="nf-new">${ICONS.plus} Nouvelle note</button></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Salarié</th><th>Catégorie</th><th>Description</th><th class="num">Montant TTC</th><th>Justificatif</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${(notesFrais&&notesFrais.length) ? notesFrais.map(n => `
            <tr>
              <td>${esc(n.date)}</td><td>${esc(n.employe_nom||'—')}</td><td>${esc(n.categorie)}</td><td>${esc(n.description||'—')}</td>
              <td class="num">${money(n.montant_ttc)}</td>
              <td>${n.justificatif_path ? `<button class="btn btn-ghost btn-sm" data-voir-justificatif="${esc(n.justificatif_path)}">Voir</button>` : '—'}</td>
              <td>${noteFraisStatutPill(n.statut)}</td>
              <td>${n.statut==='A valider' ? `<button class="btn btn-ghost btn-sm" data-valider-nf="${n.id}">Valider</button>` : n.statut==='Validee' ? `<button class="btn btn-ghost btn-sm" data-rembourser-nf="${n.id}">Marquer remboursée</button>` : ''}</td>
            </tr>`).join('') : emptyRow(8,'Aucune note de frais.')}
        </tbody>
      </table></div>
    </div>`;

  document.getElementById('nf-new').onclick = () => drawerNoteFrais(main, employes||[]);
  main.querySelectorAll('[data-voir-justificatif]').forEach(b => b.onclick = () => voirJustificatif(b.dataset.voirJustificatif));
  document.getElementById('compta-refresh').onclick = () => {
    state.comptaDebut = document.getElementById('compta-debut').value || state.comptaDebut;
    state.comptaFin = document.getElementById('compta-fin').value || state.comptaFin;
    viewCompta(main);
  };
  main.querySelectorAll('[data-valider-nf]').forEach(b => b.onclick = async () => {
    await sb.from('notes_frais').update({ statut: 'Validee' }).eq('id', b.dataset.validerNf);
    toast('Note validée.'); viewCompta(main);
  });
  main.querySelectorAll('[data-rembourser-nf]').forEach(b => b.onclick = async () => {
    await sb.from('notes_frais').update({ statut: 'Remboursee' }).eq('id', b.dataset.rembourserNf);
    toast('Note marquée remboursée.'); viewCompta(main);
  });
  document.getElementById('export-ventes').onclick = async () => {
    const { data } = await sb.from('v_factures').select('*').eq('entreprise_id', state.entreprise.id)
      .gte('date_emission', state.comptaDebut).lte('date_emission', state.comptaFin).order('date_emission');
    downloadCSV(`ventes_${state.comptaDebut}_${state.comptaFin}.csv`,
      (data||[]).map(f => ({ Numero:f.numero_facture, Type:f.type, Date:f.date_emission, Client:f.client_nom, Chantier:f.numero_chantier, MontantHT:num2(f.montant_ht), TVA:num2(f.tva), MontantTTC:num2(f.montant_ttc), Statut:f.statut, DatePaiement:f.date_paiement||'' })),
      ['Numero','Type','Date','Client','Chantier','MontantHT','TVA','MontantTTC','Statut','DatePaiement']);
  };
  document.getElementById('export-achats').onclick = async () => {
    const { data } = await sb.from('factures_achats').select('*').eq('entreprise_id', state.entreprise.id)
      .gte('date_facture', state.comptaDebut).lte('date_facture', state.comptaFin).order('date_facture');
    downloadCSV(`achats_${state.comptaDebut}_${state.comptaFin}.csv`,
      (data||[]).map(f => ({ NumeroFournisseur:f.numero_fournisseur||'', Date:f.date_facture, Fournisseur:f.fournisseur_nom, MontantHT:num2(f.montant_ht), TVA:num2(f.tva), MontantTTC:num2(f.montant_ttc), Statut:f.statut_paiement, DatePaiement:f.date_paiement||'' })),
      ['NumeroFournisseur','Date','Fournisseur','MontantHT','TVA','MontantTTC','Statut','DatePaiement']);
  };

  const [{ data: ventesTva }, { data: achatsTva }] = await Promise.all([
    sb.from('v_factures').select('tva').eq('entreprise_id', state.entreprise.id).gte('date_emission', state.comptaDebut).lte('date_emission', state.comptaFin),
    sb.from('factures_achats').select('tva').eq('entreprise_id', state.entreprise.id).gte('date_facture', state.comptaDebut).lte('date_facture', state.comptaFin),
  ]);
  const collectee = (ventesTva||[]).reduce((s,f)=>s+Number(f.tva||0),0);
  const deductible = (achatsTva||[]).reduce((s,f)=>s+Number(f.tva||0),0);
  document.getElementById('tva-card').innerHTML = `
    <h3>Récap TVA — ${esc(state.comptaDebut)} au ${esc(state.comptaFin)}</h3>
    <div class="grid-kpi" style="margin-bottom:0">
      ${kpi('TVA collectée (ventes)', money(collectee), '', '')}
      ${kpi('TVA déductible (achats)', money(deductible), '', '')}
      ${kpi('TVA à payer', money(collectee-deductible), '', (collectee-deductible)>=0?'warn':'good')}
    </div>
    <div class="view-sub" style="margin-top:10px">Indicatif — régime réel/simplifié, prorata et immobilisations non gérés ici : à vérifier avec ton comptable avant toute déclaration.</div>`;
}

// ---------- ROOT RENDER ----------
function render(){
  if (!state.session){ renderAuth('login'); return; }
  if (!state.profil){ renderOnboarding(); return; }
  renderShell();
}

initAuth();
</script>
</body>
</html>
