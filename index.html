<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#EFEBE2; --border:#E0DACB;
  --fg:#17221E; --fg-muted:#5B6B64; --accent:#0B4A46; --accent-2:#12A79D;
  --success:#2F7A4F; --success-bg:#E4F2E8; --warning:#A5680B; --warning-bg:#FBEFD9; --danger:#B3261E; --danger-bg:#FAE3E1;
  --radius:12px; --font-display:'Jost',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --surface:#182420; --surface-2:#1F2C27; --border:#2B3A33;
    --fg:#EDF2EE; --fg-muted:#9BAFA6; --accent:#45C7A6; --accent-2:#2E9684;
    --success:#6FCB8E; --success-bg:#1C3327; --warning:#E3B35B; --warning-bg:#3A2E15; --danger:#F08A82; --danger-bg:#3A1E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#182420; --surface-2:#1F2C27; --border:#2B3A33;
  --fg:#EDF2EE; --fg-muted:#9BAFA6; --accent:#45C7A6; --accent-2:#2E9684;
  --success:#6FCB8E; --success-bg:#1C3327; --warning:#E3B35B; --warning-bg:#3A2E15; --danger:#F08A82; --danger-bg:#3A1E1B;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font-family:var(--font-body);cursor:pointer}
input,select{font-family:var(--font-body);font-size:14px}
table{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
img{max-width:100%}

.app{display:flex;min-height:100%;width:100%}
.sidebar{width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:16px}
.nav-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);padding:14px 12px 6px;opacity:.75}
.nav-group:first-of-type .nav-group-label{padding-top:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:none;background:transparent;color:var(--fg-muted);text-align:left;font-size:13.5px;font-weight:500;white-space:nowrap;width:100%}
.nav-btn svg{flex:none;width:16px;height:16px;opacity:.8}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn.active{background:var(--accent);color:#fff}
.nav-btn.active svg{opacity:1}
.nav-spacer{flex:1}
.nav-search-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg-muted);font-size:12px;cursor:pointer}
.nav-search-hint:hover{border-color:var(--accent-2)}
.nav-search-hint kbd{font-family:var(--font-mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.nav-foot{padding:10px 12px;border-top:1px solid var(--border);margin-top:8px;display:flex;flex-direction:column;gap:6px}
.nav-ent{font-size:12px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--fg-muted);font-size:12.5px}
.logout:hover{color:var(--danger);border-color:var(--danger)}

.main{flex:1;min-width:0;padding:28px 24px 60px 24px;overflow-x:hidden}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.view-head h1{font-size:22px}
.view-sub{color:var(--fg-muted);font-size:13px;margin-top:2px}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi-label{font-size:12px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:6px}
.kpi.warn .kpi-value{color:var(--warning)}
.kpi.bad .kpi-value{color:var(--danger)}
.kpi.good .kpi-value{color:var(--success)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.card h3{font-size:15px;margin-bottom:12px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
th{background:var(--surface-2);color:var(--fg-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty-row td{color:var(--fg-muted);text-align:center;padding:24px;font-style:italic}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill-ok{background:var(--success-bg);color:var(--success)}
.pill-warn{background:var(--warning-bg);color:var(--warning)}
.pill-bad{background:var(--danger-bg);color:var(--danger)}
.pill-muted{background:var(--surface-2);color:var(--fg-muted)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent-2);outline-offset:-1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

.two-pane{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pane-list{flex:1 1 260px;min-width:240px}
.pane-detail{flex:2 1 400px;min-width:0}
.list-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:var(--surface)}
.list-item.active{border-color:var(--accent);background:var(--surface-2)}
.list-item button{background:none;border:none;text-align:left;flex:1;min-width:0;font-size:13px;color:var(--fg)}
.list-item .meta{font-size:11.5px;color:var(--fg-muted)}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px}
.auth-mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;margin-bottom:16px}
.auth-card h1{font-size:21px;margin-bottom:4px}
.auth-card p{color:var(--fg-muted);font-size:13px;margin-bottom:20px}
.auth-field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
.auth-field label{font-size:12px;font-weight:600;color:var(--fg-muted)}
.auth-field input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg)}
.auth-toggle{margin-top:16px;text-align:center;font-size:13px;color:var(--fg-muted)}
.auth-toggle button{background:none;border:none;color:var(--accent);font-weight:600;padding:0}
.auth-error{background:var(--danger-bg);color:var(--danger);padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.auth-msg{background:var(--success-bg);color:var(--success);padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:12px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ---- list toolbar / search ---- */
.list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-input{flex:1;max-width:320px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:13px}
.search-input:focus{outline:2px solid var(--accent-2);outline-offset:-1px}
.view-actions{display:flex;gap:8px;align-items:center}
.segmented{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.segmented button{padding:7px 13px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--fg-muted);border:none;border-right:1px solid var(--border)}
.segmented button:last-child{border-right:none}
.segmented button.active{background:var(--accent);color:#fff}

/* ---- drawer (slide-over form panel) ---- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(12,18,16,.45);z-index:60;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer-panel{position:fixed;top:0;right:0;height:100%;width:min(460px,92vw);background:var(--surface);border-left:1px solid var(--border);z-index:61;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.14);animation:slideIn .18s ease}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);flex:none}
.drawer-head h3{font-size:16px}
.drawer-close{background:none;border:none;color:var(--fg-muted);font-size:18px;line-height:1;padding:4px;border-radius:6px}
.drawer-close:hover{background:var(--surface-2);color:var(--fg)}
.drawer-body{padding:18px 20px;overflow-y:auto;flex:1}
.drawer-body .form-grid{grid-template-columns:1fr}
.drawer-body .field{width:100%}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex:none}
.btn-new{display:inline-flex;align-items:center;gap:6px}

/* ---- kanban ---- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kanban-col{flex:0 0 240px;background:var(--surface-2);border-radius:var(--radius);padding:10px}
.kanban-col-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 10px;font-size:12.5px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.03em}
.kanban-col.dragover{outline:2px dashed var(--accent-2);outline-offset:2px}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;font-size:12.5px}
.kanban-card:active{cursor:grabbing}
.kanban-card .kc-title{font-weight:600;font-size:13px;margin-bottom:3px}
.kanban-card .kc-meta{color:var(--fg-muted);font-size:11.5px}
.kanban-card .kc-amount{margin-top:6px;font-weight:700;font-family:var(--font-mono);font-size:12.5px}
.kanban-empty{font-size:12px;color:var(--fg-muted);font-style:italic;padding:4px 6px}

/* ---- command palette ---- */
.cmdk-backdrop{position:fixed;inset:0;background:rgba(12,18,16,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.cmdk-box{width:min(520px,90vw);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.cmdk-input{width:100%;border:none;border-bottom:1px solid var(--border);padding:16px 18px;font-size:15px;background:transparent;color:var(--fg)}
.cmdk-input:focus{outline:none}
.cmdk-results{max-height:360px;overflow-y:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}
.cmdk-item svg{width:15px;height:15px;opacity:.7;flex:none}
.cmdk-item.sel{background:var(--accent);color:#fff}
.cmdk-item.sel svg{opacity:1}
.cmdk-empty{padding:16px 14px;font-size:13px;color:var(--fg-muted)}

/* ---- mini chart ---- */
.chart-wrap{display:flex;align-items:flex-end;gap:10px;height:140px;padding:6px 4px}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:38px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.chart-bar-label{font-size:10.5px;color:var(--fg-muted);text-transform:capitalize}
.chart-bar-value{font-size:10.5px;color:var(--fg-muted);font-family:var(--font-mono)}

/* ---- printable documents ---- */
#print-area{display:none}
@media print{
  body > *:not(#print-area){display:none!important}
  #print-area{display:block!important}
}
.print-doc{font-family:Arial,Helvetica,sans-serif;color:#111;padding:20px;max-width:720px;margin:0 auto}
.print-head{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #0B4A46;padding-bottom:14px;margin-bottom:20px;font-size:12.5px}
.print-ent-nom{font-weight:700;font-size:17px;margin-bottom:4px}
.print-doctype{text-align:right}
.print-doctype-label{font-weight:700;font-size:16px;color:#0B4A46;margin-bottom:4px}
.print-client{margin-bottom:18px;font-size:13px}
.print-client-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#666;margin-bottom:3px}
.print-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:16px}
.print-table th{background:#F0EEE6;text-align:left;padding:7px 9px;border-bottom:1px solid #ccc;font-size:11px;text-transform:uppercase}
.print-table td{padding:7px 9px;border-bottom:1px solid #e4e4e4}
.print-totals{margin-left:auto;width:260px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.print-totals>div{display:flex;justify-content:space-between}
.print-total-ttc{border-top:1px solid #111;padding-top:6px;font-size:15px}
.print-cond{margin-top:18px;font-size:12px}
.print-footer{margin-top:10px;font-size:11px;color:#444}
.print-footer-legal{margin-top:30px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#666}

[hidden]{display:none!important}

.mobile-topbar{display:none}
.mobile-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--fg);display:flex;align-items:center;justify-content:center}
.mobile-btn svg{width:18px;height:18px}
.mobile-btn:hover{background:var(--surface-2)}
.mobile-nav-drawer .nav-btn{color:var(--fg)}
.mobile-nav-drawer .nav-btn.active{background:var(--accent);color:#fff}
@media (max-width: 760px){
  .app{flex-direction:column}
  .sidebar{display:none}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
  .main{padding:16px 14px 60px 14px}
  .view-head{gap:8px}
  .drawer-panel{width:100vw}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="drawer-host"></div>
<div id="cmdk-host"></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://ercjfokzimdtaccfabpd.supabase.co',
  'sb_publishable_t2se76ex7Tm-Gj9JPz1FdA_pdbCndDi'
);

const root = document.getElementById('root');
const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2400);
}
function money(n){ n = Number(n||0); return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function num(n, d){ d = d===undefined?2:d; return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:d}); }
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLocalInput(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function dt(s){ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function joursRestants(dateStr){ if(!dateStr) return null; const diff = (new Date(dateStr) - new Date(todayISO())) / 86400000; return Math.round(diff); }
function echeancePill(dateStr, label){
  if (!dateStr) return '<span class="pill pill-muted">—</span>';
  const j = joursRestants(dateStr);
  const cls = j < 0 ? 'pill-bad' : j <= 30 ? 'pill-warn' : 'pill-ok';
  const txt = j < 0 ? `${label||''} dépassée` : `${label||''} dans ${j} j`;
  return `<span class="pill ${cls}">${esc(txt.trim())}</span>`;
}

// ---------- DRAWER (slide-over form panel) ----------
function openDrawer(title, bodyHtml, mountFn){
  state.drawer = { title, bodyHtml, mountFn };
  renderDrawer();
}
function closeDrawer(){
  state.drawer = null;
  document.getElementById('drawer-host').innerHTML = '';
}
function renderDrawer(){
  const host = document.getElementById('drawer-host');
  if (!state.drawer){ host.innerHTML = ''; return; }
  host.innerHTML = `
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true">
      <div class="drawer-head"><h3>${esc(state.drawer.title)}</h3><button class="drawer-close" id="drawer-close" type="button">✕</button></div>
      <div class="drawer-body">${state.drawer.bodyHtml}</div>
    </div>`;
  document.getElementById('drawer-backdrop').onclick = closeDrawer;
  document.getElementById('drawer-close').onclick = closeDrawer;
  if (state.drawer.mountFn) state.drawer.mountFn();
}

// ---------- DOCUMENTS IMPRIMABLES (PDF via impression navigateur) + EMAIL ----------
function buildDocFragment(typeLabel, doc){
  const ent = state.entreprise;
  return `
    <div class="print-doc">
      <div class="print-head">
        <div>
          ${ent.logo_url ? `<img src="${esc(ent.logo_url)}" alt="" style="max-height:44px;max-width:180px;object-fit:contain;display:block;margin-bottom:8px">` : ''}
          <div class="print-ent-nom">${esc(ent.nom||'')}</div>
          ${ent.adresse ? `<div>${esc(ent.adresse)}</div>` : ''}
          ${ent.forme_juridique ? `<div>${esc(ent.forme_juridique)}</div>` : ''}
          ${ent.siret ? `<div>SIRET ${esc(ent.siret)}</div>` : ''}
          ${ent.tva_intracom ? `<div>TVA intracommunautaire : ${esc(ent.tva_intracom)}</div>` : ''}
        </div>
        <div class="print-doctype">
          <div class="print-doctype-label">${esc(typeLabel)}</div>
          <div>N° ${esc(doc.numero)}</div>
          <div>Date : ${esc(doc.date)}</div>
          ${doc.numeroChantier ? `<div>Chantier : ${esc(doc.numeroChantier)}</div>` : ''}
        </div>
      </div>
      <div class="print-client">

function loadImageAsPngDataUrl(url, maxDim){
  maxDim = maxDim || 500; // une image source trop grande fait exploser la taille du PDF (jsPDF ne recompresse pas toujours bien les PNG)
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        let w = img.naturalWidth || 200, h = img.naturalHeight || 200;
        if (w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: canvas.toDataURL('image/png'), w, h });
      } catch (e){ resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
function pdfSafe(s){
  // la police standard du PDF (WinAnsi) n'a pas le glyphe de l'espace fine insécable
  // utilisée par toLocaleString('fr-FR') pour les milliers -> on la remplace par un espace normal
  return String(s==null?'':s).replace(/[  ]/g, ' ');
}
async function buildPdfDoc(typeLabel, doc){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  const ent = state.entreprise;
  const marginL = 15, marginR = 195, pageBottom = 268;
  const teal = [11,74,70], gray = [100,100,100], black = [20,20,20];
  const mny = (n) => pdfSafe(money(n));
  const nm = (n,d) => pdfSafe(num(n,d));
  const txt = (s) => pdfSafe(s);
  let y = 20;
  const checkPageBreak = (needed) => { if (y + needed > pageBottom){ pdf.addPage(); y = 20; } };

  if (ent.logo_url){
    const img = await loadImageAsPngDataUrl(ent.logo_url);
    if (img && img.w && img.h){
      const maxW = 38, maxH = 16;
      let w = maxW, h = maxW / img.w * img.h;
      if (h > maxH){ h = maxH; w = maxH / img.h * img.w; }
      try { pdf.addImage(img.dataUrl, 'PNG', marginL, y - 5, w, h); y += h + 3; } catch (e){}
    }
  }

  pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(...black);
  pdf.text(txt(ent.nom || ''), marginL, y);
  let yLeft = y + 6;
  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...gray);
  [ent.adresse, ent.forme_juridique, ent.siret ? `SIRET ${ent.siret}` : '', ent.tva_intracom ? `TVA intracommunautaire : ${ent.tva_intracom}` : '']
    .filter(Boolean).forEach(line => { pdf.text(txt(line), marginL, yLeft); yLeft += 4.5; });

  let yRight = y;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor(...teal);
  pdf.text(txt(typeLabel), marginR, yRight, { align: 'right' }); yRight += 6;
  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...black);
  pdf.text(txt(`N° ${doc.numero||''}`), marginR, yRight, { align:'right' }); yRight += 4.5;
  pdf.text(txt(`Date : ${doc.date||''}`), marginR, yRight, { align:'right' }); yRight += 4.5;
  if (doc.numeroChantier){ pdf.text(txt(`Chantier : ${doc.numeroChantier}`), marginR, yRight, { align:'right' }); yRight += 4.5; }

  y = Math.max(yLeft, yRight) + 4;
  pdf.setDrawColor(...teal); pdf.setLineWidth(0.6);
  pdf.line(marginL, y, marginR, y);
  y += 8;

  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(...gray);
  pdf.text(txt((doc.destinataireLabel || 'CLIENT').toUpperCase()), marginL, y); y += 4.5;
  pdf.setFont('helvetica','normal'); pdf.setFontSize(11); pdf.setTextColor(...black);
  pdf.text(txt(doc.clientNom || 'Client ponctuel'), marginL, y); y += 9;

  const colX = { desig: marginL, qteEnd: 133, puEnd: 157, tvaEnd: 177 };
  pdf.setFillColor(240,238,230);
  pdf.rect(marginL, y-4.5, marginR-marginL, 7, 'F');
  pdf.setFont('helvetica','bold'); pdf.setFontSize(8); pdf.setTextColor(...gray);
  pdf.text('DÉSIGNATION', colX.desig+1, y);
  pdf.text('QTÉ', colX.qteEnd, y, { align:'right' });
  pdf.text('PU HT', colX.puEnd, y, { align:'right' });
  pdf.text('TVA', colX.tvaEnd, y, { align:'right' });
  pdf.text('TOTAL HT', marginR, y, { align:'right' });
  y += 7;

  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...black);
  (doc.lignes||[]).forEach(l => {
    const desigLines = pdf.splitTextToSize(txt(l.designation||''), 100);
    const rowH = Math.max(7, desigLines.length*5);
    checkPageBreak(rowH + 3);
    pdf.text(desigLines, colX.desig, y);
    pdf.text(nm(l.quantite), colX.qteEnd, y, { align:'right' });
    pdf.text(mny(l.pu), colX.puEnd, y, { align:'right' });
    pdf.text(nm(l.tva,1)+'%', colX.tvaEnd, y, { align:'right' });
    pdf.text(mny(l.total), marginR, y, { align:'right' });
    y += rowH;
    pdf.setDrawColor(224,224,224); pdf.setLineWidth(0.2);
    pdf.line(marginL, y-2.8, marginR, y-2.8);
  });

  y += 5;
  checkPageBreak(24);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...black);
  pdf.text('Total HT', marginR-45, y); pdf.text(mny(doc.totalHT), marginR, y, {align:'right'}); y += 5;
  pdf.setTextColor(...gray);
  pdf.text(txt(`TVA (${nm(doc.tauxTva,1)}%)`), marginR-45, y); pdf.text(mny(doc.totalTVA), marginR, y, {align:'right'}); y += 5;
  pdf.setDrawColor(20,20,20); pdf.setLineWidth(0.3); pdf.line(marginR-45, y, marginR, y); y += 5;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(...black);
  pdf.text('Total TTC', marginR-45, y); pdf.text(mny(doc.totalTTC), marginR, y, {align:'right'});
  y += 11;

  if (doc.extraLine){
    const lines = pdf.splitTextToSize(txt(doc.extraLine), marginR-marginL);
    checkPageBreak(lines.length*4.5 + 4);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...black);
    pdf.text(lines, marginL, y); y += lines.length*4.5 + 4;
  }
  if (doc.conditionsPaiement){
    checkPageBreak(7);
    pdf.setFontSize(9); pdf.setTextColor(...black);
    pdf.text(txt(`Conditions de paiement : ${doc.conditionsPaiement}`), marginL, y); y += 7;
  }

  // Pied de page legal : fixe en bas de CHAQUE page, pas juste a la suite du contenu
  const footerParts = [];
  if (ent.assurance_decennale_assureur) footerParts.push(`Assurance décennale : ${ent.assurance_decennale_assureur}${ent.assurance_decennale_attestation ? ' — attestation ' + ent.assurance_decennale_attestation : ''}${ent.assurance_decennale_validite ? (' (valide jusqu\'au ' + ent.assurance_decennale_validite + ')') : ''}.`);
  if (ent.rc_pro_assureur) footerParts.push(`RC Pro : ${ent.rc_pro_assureur}.`);
  if (ent.iban) footerParts.push(`IBAN ${ent.iban}${ent.bic ? ' — BIC ' + ent.bic : ''}.`);
  if (ent.pied_page_legal) footerParts.push(ent.pied_page_legal);
  if (footerParts.length){
    const footerText = txt(footerParts.join(' '));
    const footerLines = pdf.splitTextToSize(footerText, marginR-marginL-20);
    const pageH = pdf.internal.pageSize.getHeight();
    const pageCenterX = (marginL + marginR) / 2;
    const footerY = pageH - 15 - Math.max(0, footerLines.length-1)*3.6;
    const totalPages = pdf.internal.getNumberOfPages();
    for (let p = 1; p <= totalPages; p++){
      pdf.setPage(p);
      pdf.setDrawColor(221,221,221); pdf.setLineWidth(0.2);
      pdf.line(marginL, footerY - 5, marginR, footerY - 5);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(7); pdf.setTextColor(...gray);
      pdf.text(footerLines, pageCenterX, footerY, { align: 'center' });
      pdf.text(`${p} / ${totalPages}`, pageCenterX, footerY + footerLines.length*3.6 + 3, { align: 'center' });
    }
  }
  return pdf;
}

async function copyTextRobust(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e){
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e2){ return false; }
  }
}

function filterRows(items, term, fields){

function num2(n){ return Number(n||0).toFixed(2).replace('.', ','); }
function downloadCSV(filename, rows, headers){
  const escCsv = (v) => { const s = String(v==null?'':v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [headers.join(';'), ...rows.map(r => headers.map(h => escCsv(r[h])).join(';'))];
  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------- COMMAND PALETTE ----------
function openCommandPalette(){
  const host = document.getElementById('cmdk-host');
  let sel = 0;
  const renderList = (term) => {
    const items = NAV.filter(n => !term || n.label.toLowerCase().includes(term.toLowerCase()));
    sel = Math.min(sel, Math.max(items.length-1,0));
    const list = host.querySelector('.cmdk-results');
    list.innerHTML = items.length ? items.map((n,i) => `
      <div class="cmdk-item${i===sel?' sel':''}" data-go="${n.id}">${ICONS[n.id]||''}<span>${esc(n.label)}</span></div>
    `).join('') : `<div class="cmdk-empty">Aucun résultat.</div>`;
    list.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { go(el.dataset.go); });
    return items;
  };
  const go = (id) => { state.view = id; closeCommandPalette(); renderShell(); };
  host.innerHTML = `
    <div class="cmdk-backdrop" id="cmdk-backdrop">
      <div class="cmdk-box" onclick="event.stopPropagation()">
        <input class="cmdk-input" id="cmdk-input" placeholder="Aller à… (Devis, Factures, Planning…)" autocomplete="off">
        <div class="cmdk-results"></div>
      </div>
    </div>`;
  let currentItems = renderList('');
  document.getElementById('cmdk-backdrop').onclick = closeCommandPalette;
  const input = document.getElementById('cmdk-input');
  input.focus();
  input.oninput = () => { currentItems = renderList(input.value); };
  input.onkeydown = (e) => {
    if (e.key === 'Escape'){ closeCommandPalette(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, currentItems.length-1); currentItems = renderList(input.value); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); currentItems = renderList(input.value); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (currentItems[sel]) go(currentItems[sel].id); }
  };
}
function closeCommandPalette(){ document.getElementById('cmdk-host').innerHTML = ''; }
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if (document.getElementById('cmdk-host').innerHTML.trim()) closeCommandPalette();
    else if (state.session) openCommandPalette();
  } else if (e.key === 'Escape' && state.drawer && !document.getElementById('cmdk-host').innerHTML.trim()){
    closeDrawer();
  }
});

async function initAuth(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) await loadProfil();
  render();
  sb.auth.onAuthStateChange(async (_evt, session) => {
    state.session = session;
    if (session) { await loadProfil(); } else { state.profil = null; state.entreprise = null; }
    render();
  });
}

async function loadProfil(){
  const { data: profil } = await sb.from('profils').select('*').eq('id', state.session.user.id).maybeSingle();
  state.profil = profil || null;
  if (profil){
    const { data: ent } = await sb.from('entreprises').select('*').eq('id', profil.entreprise_id).maybeSingle();
    state.entreprise = ent || null;
  }
}

function renderAuth(mode){
  mode = mode || 'login';
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-mark">AE</div>
        <h1>Atelier ERP</h1>
        <p>${mode==='login' ? 'Connectez-vous à votre espace entreprise.' : 'Créez votre espace entreprise — devis, heures, stock et rentabilité au même endroit.'}</p>
        <div id="auth-alert"></div>
        <form id="auth-form">
          <div class="auth-field"><label for="auth-email">Email</label><input id="auth-email" type="email" required autocomplete="email"></div>
          <div class="auth-field"><label for="auth-password">Mot de passe</label><input id="auth-password" type="password" required minlength="6" autocomplete="${mode==='login'?'current-password':'new-password'}"></div>
          ${mode==='signup' ? `
          <div class="auth-field"><label for="auth-nom">Votre nom</label><input id="auth-nom" type="text" required></div>
          <div class="auth-field"><label for="auth-entreprise">Nom de l'entreprise</label><input id="auth-entreprise" type="text" required></div>
          <div class="auth-field"><label for="auth-secteur">Métier / secteur</label><input id="auth-secteur" type="text" placeholder="ex. menuiserie, composite, électricité"></div>
          ` : ''}
          <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px" id="auth-submit">${mode==='login' ? 'Se connecter' : 'Créer mon espace'}</button>
        </form>
        <div class="auth-toggle">
          ${mode==='login'
            ? `Pas encore de compte ? <button id="auth-switch">Créer un espace</button>`
            : `Déjà un compte ? <button id="auth-switch">Se connecter</button>`}
        </div>
      </div>
    </div>`;
  document.getElementById('auth-switch').onclick = () => renderAuth(mode==='login' ? 'signup' : 'login');
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('auth-submit');
    const alertBox = document.getElementById('auth-alert');
    alertBox.innerHTML = '';
    btn.disabled = true;
    try {
      if (mode === 'login'){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const nom = document.getElementById('auth-nom').value.trim();
        const entNom = document.getElementById('auth-entreprise').value.trim();
        const secteur = document.getElementById('auth-secteur').value.trim();
        const { data: signData, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (!signData.session){
          alertBox.innerHTML = `<div class="auth-msg">Compte créé. Si la confirmation par email est activée, vérifiez votre boîte mail avant de vous connecter.</div>`;
          btn.disabled = false;
          return;
        }
        state.session = signData.session;
        const { error: rpcErr } = await sb.rpc('creer_entreprise_et_profil', { p_nom: entNom, p_secteur: secteur });
        if (rpcErr) throw rpcErr;
        await loadProfil();
        await sb.from('profils').update({ nom }).eq('id', state.session.user.id);
        render();
        return;
      }
    } catch (err){
      alertBox.innerHTML = `<div class="auth-error">${esc(err.message || 'Une erreur est survenue.')}</div>`;
      btn.disabled = false;
    }
  };
}

async function viewDashboard(main){
  const [{ data: d }, { data: rent }, { data: alertesMateriel }, { data: alertesHabilitations }, { data: facturesChart }] = await Promise.all([
    sb.from('v_dashboard').select('*').eq('entreprise_id', state.entreprise.id).maybeSingle(),
    sb.from('v_rentabilite').select('*').eq('entreprise_id', state.entreprise.id).order('numero_chantier'),
    sb.from('v_alertes_materiel').select('*').eq('entreprise_id', state.entreprise.id),
    sb.from('v_alertes_habilitations').select('*').eq('entreprise_id', state.entreprise.id),
    sb.from('v_factures').select('date_emission,montant_ttc').eq('entreprise_id', state.entreprise.id),
  ]);
  const row = d || {};
  const moisLabels = [];
  const moisTotaux = {};
  for (let i = 5; i >= 0; i--){
    const dt2 = new Date(); dt2.setDate(1); dt2.setMonth(dt2.getMonth() - i);
    const key = `${dt2.getFullYear()}-${String(dt2.getMonth()+1).padStart(2,'0')}`;
    moisLabels.push({ key, label: dt2.toLocaleDateString('fr-FR',{month:'short'}) });
    moisTotaux[key] = 0;
  }
  (facturesChart||[]).forEach(f => {
    const key = (f.date_emission||'').slice(0,7);
    if (key in moisTotaux) moisTotaux[key] += Number(f.montant_ttc||0);
  });
  const maxMois = Math.max(1, ...moisLabels.map(m => moisTotaux[m.key]));
  const alertes = [
    ...(alertesMateriel||[]).map(m => ({ label: `${m.nom} — ${m.date_prochain_controle && joursRestants(m.date_prochain_controle)<=30 ? 'contrôle' : 'assurance'}`, date: m.date_prochain_controle || m.date_prochaine_assurance })),
    ...(alertesHabilitations||[]).map(h => ({ label: `${h.employe_nom||'—'} — ${h.intitule}`, date: h.date_expiration })),
  ].sort((a,b) => new Date(a.date) - new Date(b.date));
  main.innerHTML = `
    <div class="view-head">
      <div><h1>Dashboard</h1><div class="view-sub">${esc(state.entreprise.nom)} — vue d'ensemble</div></div>
    </div>
    <div class="grid-kpi">
      ${kpi('Chantiers suivis', row.nb_chantiers||0, '', '')}
      ${kpi('CA total', money(row.ca_total), '', '')}
      ${kpi('Marge brute totale', money(row.marge_totale), '', (row.marge_totale||0) >= 0 ? 'good':'bad')}
      ${kpi('Heures réelles', num(row.heures_totales)+' h', '', '')}
      ${kpi('Chantiers en dépassement', row.chantiers_depassement||0, '', (row.chantiers_depassement||0)>0?'warn':'good')}
      ${kpi('Stock à commander', row.stock_a_commander||0, '', (row.stock_a_commander||0)>0?'warn':'good')}
      ${kpi('Total facturé TTC', money(row.total_facture_ttc), '', '')}
      ${kpi('Encaissé', money(row.total_encaisse), '', 'good')}
      ${kpi('Factures en retard', money(row.total_en_retard), '', (row.total_en_retard||0)>0?'bad':'good')}
      ${kpi('Clients actifs', row.nb_clients||0, '', '')}
      ${kpi('Interventions (14j)', row.interventions_7j||0, '', '')}
      ${kpi('Alertes matériel/véhicule', row.materiel_alertes||0, '', (row.materiel_alertes||0)>0?'warn':'good')}
      ${kpi('Habilitations à renouveler', row.habilitations_alertes||0, '', (row.habilitations_alertes||0)>0?'warn':'good')}
      ${kpi('Commandes en attente', row.commandes_en_attente||0, '', (row.commandes_en_attente||0)>0?'warn':'good')}
      ${kpi('Sous-traitance à payer', money(row.sous_traitance_a_payer), '', (row.sous_traitance_a_payer||0)>0?'warn':'good')}
      ${kpi('Factures fournisseurs à payer', money(row.factures_achats_a_payer), '', (row.factures_achats_a_payer||0)>0?'warn':'good')}
    </div>
    <div class="card">
      <h3>CA facturé TTC — 6 derniers mois</h3>
      <div class="chart-wrap">
        ${moisLabels.map(m => { const v = moisTotaux[m.key]; const h = Math.max(2, Math.round(v / maxMois * 100)); return `
          <div class="chart-bar-col">
            <div class="chart-bar-value">${v ? money(v) : ''}</div>
            <div class="chart-bar" style="height:${h}%"></div>
            <div class="chart-bar-label">${esc(m.label)}</div>
          </div>`; }).join('')}
      </div>
    </div>
    ${alertes.length ? `
    <div class="card">
      <h3>Alertes échéances (30 jours)</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Élément</th><th>Échéance</th></tr></thead>
        <tbody>${alertes.map(a => `<tr><td>${esc(a.label)}</td><td>${echeancePill(a.date)}</td></tr>`).join('')}</tbody>

      <h3>Rentabilité par chantier</h3>
      <div class="table-wrap"><table>

function kpi(label, value, sub, tone){

}
function emptyRow(colspan, text){ return `<tr class="empty-row"><td colspan="${colspan}">${esc(text)}</td></tr>`; }
function statutChantierPill(s){
  const cls = s==='Accepte' ? 'pill-ok' : s==='Refuse' ? 'pill-bad' : 'pill-muted';
  const label = {'Devis envoye':'Devis envoyé','Accepte':'Accepté','Refuse':'Refusé'}[s] || (s||'—');
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

const DEVIS_STATUTS = ['Devis envoye','Accepte','Refuse'];
const DEVIS_STATUT_LABELS = {'Devis envoye':'Devis envoyé','Accepte':'Accepté','Refuse':'Refusé','En cours':'En cours (legacy)','Termine':'Terminé (legacy)'};

async function viewDevis(main, term){
  const [{ data: devisList }, taches, { data: clients }] = await Promise.all([
    sb.from('devis').select('*').eq('entreprise_id', state.entreprise.id).order('date', { ascending:false }),
    fetchBibliotheque(),
    sb.from('clients').select('*').eq('entreprise_id', state.entreprise.id).order('nom'),
  ]);
  const list = devisList || [];
  const filtered = filterRows(list, term, ['numero','numero_chantier','client_nom']);
  if (!state.selectedDevisId && list.length) state.selectedDevisId = list[0].id;
  const selected = list.find(d => d.id === state.selectedDevisId) || null;

  main.innerHTML = `
    <div class="view-head">
      <div><h1>Devis</h1><div class="view-sub">Un numéro de chantier par dossier — génère le prix de vente de référence.</div></div>
      <div class="view-actions">
        <div class="segmented"><button data-devisview="kanban" class="${state.devisView==='kanban'?'active':''}">Kanban</button><button data-devisview="list" class="${state.devisView==='list'?'active':''}">Liste</button></div>
      </div>
    </div>
    <div class="list-toolbar">
      <input class="search-input" id="devis-search" placeholder="Rechercher un devis, un client…" value="${esc(term||'')}">
      <button class="btn btn-primary btn-new" id="devis-new">${ICONS.plus} Nouveau devis</button>
    </div>
    <div id="devis-body"></div>`;

  document.getElementById('devis-new').onclick = () => drawerDevis(main, list, clients||[]);
  document.getElementById('devis-search').oninput = (e) => viewDevis(main, e.target.value);
  main.querySelectorAll('[data-devisview]').forEach(b => b.onclick = () => { state.devisView = b.dataset.devisview; viewDevis(main, term); });

  const body = document.getElementById('devis-body');
  if (state.devisView === 'kanban'){
    const { data: lignes } = filtered.length ? await sb.from('devis_lignes').select('devis_id,total_ligne').in('devis_id', filtered.map(d=>d.id)) : { data: [] };
    const totauxHT = {};
    (lignes||[]).forEach(l => { totauxHT[l.devis_id] = (totauxHT[l.devis_id]||0) + Number(l.total_ligne||0); });
    body.innerHTML = `<div class="kanban">
      ${DEVIS_STATUTS.map(s => {
        const cards = filtered.filter(d => (d.statut||'Devis envoye') === s);
        return `<div class="kanban-col" data-col="${s}">
          <div class="kanban-col-head"><span>${DEVIS_STATUT_LABELS[s]}</span><span>${cards.length}</span></div>
          ${cards.length ? cards.map(d => {
            const ht = totauxHT[d.id]||0; const ttc = ht * (1 + Number(d.taux_tva||0)/100);
            return `<div class="kanban-card" draggable="true" data-card="${d.id}">
              <div class="kc-title">${esc(d.numero||d.numero_chantier)}</div>
              <div class="kc-meta">${esc(d.client_nom||'client ponctuel')} · ${esc(d.date)}</div>
              <div class="kc-amount">${money(ttc)}</div>
            </div>`;
          }).join('') : `<div class="kanban-empty">Vide</div>`}
        </div>`;
      }).join('')}
    </div>`;
    body.querySelectorAll('[data-card]').forEach(card => {
      card.ondragstart = (e) => { e.dataTransfer.setData('text/plain', card.dataset.card); };
      card.onclick = () => { state.selectedDevisId = card.dataset.card; state.devisView = 'list'; viewDevis(main, term); };
    });
    body.querySelectorAll('[data-col]').forEach(col => {
      col.ondragover = (e) => { e.preventDefault(); col.classList.add('dragover'); };
      col.ondragleave = () => col.classList.remove('dragover');
      col.ondrop = async (e) => {
        e.preventDefault(); col.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        const nouveauStatut = col.dataset.col;
        const { error } = await sb.from('devis').update({ statut: nouveauStatut }).eq('id', id);
        if (error) return toast('Erreur : ' + error.message);
        toast('Statut mis à jour.'); viewDevis(main, term);
      };
    });
  } else {
    body.innerHTML = `<div class="two-pane">
      <div class="pane-list">
        <h3 style="font-size:13px;margin-bottom:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.03em">Dossiers</h3>
        ${filtered.length ? filtered.map(d => `
          <div class="list-item${d.id===state.selectedDevisId?' active':''}">
            <button data-select-devis="${d.id}">
              <div><strong>${esc(d.numero||d.numero_chantier)}</strong></div>
              <div class="meta">${esc(d.numero_chantier)} · ${esc(d.client_nom||'—')} · ${esc(d.date)}</div>
            </button>
          </div>`).join('') : `<div class="meta">Aucun devis.</div>`}
      </div>
      <div class="pane-detail" id="devis-detail"></div>
    </div>`;
    body.querySelectorAll('[data-select-devis]').forEach(b => b.onclick = () => { state.selectedDevisId = b.dataset.selectDevis; viewDevis(main, term); });
    if (selected) await renderDevisDetail(main, selected, taches);
  }
}

async function creerCommandeDepuisDevis(devis){
  const { data: existing } = await sb.from('commandes_clients').select('*').eq('devis_id', devis.id).maybeSingle();
  if (existing) return existing;
  const { data: lignes } = await sb.from('devis_lignes').select('*').eq('devis_id', devis.id).order('ordre');
  const totalHT = (lignes||[]).reduce((s,l)=>s+Number(l.total_ligne||0),0);
  const { data: numero, error: numErr } = await sb.rpc('prochain_numero', { p_entreprise_id: state.entreprise.id, p_type: 'commande_client', p_prefixe: 'CDE' });
  if (numErr){ toast('Erreur numérotation commande : ' + numErr.message); return null; }
  const { data: commande, error } = await sb.from('commandes_clients').insert({
    entreprise_id: state.entreprise.id, numero, devis_id: devis.id, numero_chantier: devis.numero_chantier,
    client_id: devis.client_id, client_nom: devis.client_nom, taux_tva: devis.taux_tva, montant_ht: totalHT,
  }).select().single();
  if (error){ toast('Erreur création commande : ' + error.message); return null; }
  if (lignes && lignes.length){
    await sb.from('commandes_clients_lignes').insert(lignes.map(l => ({
      commande_id: commande.id, designation: l.designation, quantite: 1,
      prix_unitaire_ht: Number(l.total_ligne||0), taux_tva: Number(devis.taux_tva||0), total_ht: Number(l.total_ligne||0),
    })));
    // decompte automatique du stock lie aux taches de ce devis (consommable rattache a un article de stock)
    for (const l of lignes){
      if (!l.tache_id) continue;
      const { data: tache } = await sb.from('bibliotheque_taches').select('stock_id, qte_consommable').eq('id', l.tache_id).maybeSingle();
      if (tache?.stock_id && tache.qte_consommable){
        const { data: art } = await sb.from('stock').select('quantite').eq('id', tache.stock_id).maybeSingle();
        if (art){
          const nouvelleQte = Math.max(0, Number(art.quantite||0) - Number(l.quantite||1) * Number(tache.qte_consommable||0));
          await sb.from('stock').update({ quantite: nouvelleQte }).eq('id', tache.stock_id);
        }
      }
    }
  }
  return commande;
}

async function renderDevisDetail(main, devis, taches){

        <div class="field"><label>TVA (%)</label><input id="devis-tva" type="number" step="0.5" value="${tauxTva}"></div>
        <div class="field"><label>Acompte demandé (%)</label><input id="devis-acompte" type="number" step="5" value="${acomptePct}"></div>

        <div class="field"><button class="btn btn-ghost" id="devis-save-cond" type="button">Mettre à jour</button></div>
      </div>
      <form id="form-ligne" class="form-grid" style="margin-bottom:14px">
        <div class="field"><label>Tâche</label>

            <option value="">—</option>

          </select>
        </div>
        <div class="field"><label>Quantité</label><input name="quantite" type="number" step="0.5" value="1" required></div>
        <div class="field"><button class="btn btn-ghost" type="submit">+ Ajouter la ligne</button></div>
      </form>
      <div class="view-sub" style="margin-bottom:6px">Glisse ⠿ pour réordonner les lignes — l'ordre est repris tel quel sur le PDF.</div>
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>Tâche</th><th class="num">Qté</th><th class="num">Temps (h)</th><th class="num">Main d'œuvre</th><th class="num">Conso</th><th class="num">Total</th><th></th></tr></thead>
        <tbody id="devis-lignes-body">

            <tr draggable="true" data-ligne-id="${l.id}" style="cursor:grab">
              <td style="color:var(--fg-muted)">⠿</td>
              <td>${esc(l.designation||l.code_tache)}</td>

              <td class="num">${money(l.prix_main_oeuvre)}</td>
              <td class="num">${money(l.prix_consommables)}</td>
              <td class="num"><strong>${money(l.total_ligne)}</strong></td>
              <td><button class="btn btn-ghost btn-sm" data-del-ligne="${l.id}">×</button></td>

      </table></div>

    numero: devis.numero || devis.numero_chantier, date: devis.date, numeroChantier: devis.numero_chantier,
    clientNom: devis.client_nom, tauxTva, totalHT, totalTVA, totalTTC,
    extraLine: [
      acomptePct > 0 ? `Acompte demandé à la commande (${num(acomptePct,0)}%) : ${money(montantAcompte)}.` : '',
      devis.validite_jours ? `Devis valable ${devis.validite_jours} jours.` : '',
      devis.notes_libres || '',
    ].filter(Boolean).join(' '),
    lignes: (lignes||[]).map(l => ({ designation: l.designation, quantite: l.quantite, pu: Number(l.total_ligne||0)/Number(l.quantite||1), tva: tauxTva, total: l.total_ligne })),
  });
  document.getElementById('devis-print').onclick = () => printDoc('Devis', docPourImpression());
  document.getElementById('devis-download').onclick = () => downloadDoc('Devis', docPourImpression());
  document.getElementById('devis-email').onclick = () => emailDoc('Devis', docPourImpression(), devis.client_id);
  document.getElementById('devis-statut').onchange = async (e) => {
    const nouveauStatut = e.target.value;
    const { error } = await sb.from('devis').update({ statut: nouveauStatut }).eq('id', devis.id);
    if (error) return toast('Erreur : ' + error.message);
    devis.statut = nouveauStatut;
    if (nouveauStatut === 'Accepte'){
      const commande = await creerCommandeDepuisDevis(devis);
      toast(commande ? `Devis accepté → commande ${commande.numero} créée.` : 'Statut mis à jour.');
    } else {
      toast('Statut mis à jour.');
    }
    renderDevisDetail(main, devis, taches);
  };
  const btnConfirmer = document.getElementById('devis-confirmer-commande');
  if (btnConfirmer) btnConfirmer.onclick = async () => {
    const { error } = await sb.from('devis').update({ statut: 'Accepte' }).eq('id', devis.id);
    if (error) return toast('Erreur : ' + error.message);
    devis.statut = 'Accepte';
    const commande = await creerCommandeDepuisDevis(devis);
    if (!commande) return;
    toast(`Devis accepté → commande ${commande.numero} créée.`);
    state.view = 'commandes'; state.selectedCommandeClientId = commande.id;
    updateNavActive();
    await viewCommandes(document.getElementById('main'));
  };
  document.getElementById('devis-save-cond').onclick = async () => {
    const { error } = await sb.from('devis').update({
      taux_tva: Number(document.getElementById('devis-tva').value||0),
      acompte_demande_pct: Number(document.getElementById('devis-acompte').value||0),
      validite_jours: Number(document.getElementById('devis-validite').value||30),
    }).eq('id', devis.id);
    if (error) return toast('Erreur : ' + error.message);
    devis.taux_tva = Number(document.getElementById('devis-tva').value||0);
    devis.acompte_demande_pct = Number(document.getElementById('devis-acompte').value||0);
    toast('Conditions mises à jour.'); renderDevisDetail(main, devis, taches);
  };
  document.getElementById('devis-save-notes').onclick = async () => {
    const texte = document.getElementById('devis-notes').value;
    const { error } = await sb.from('devis').update({ notes_libres: texte }).eq('id', devis.id);
    if (error) return toast('Erreur : ' + error.message);
    devis.notes_libres = texte;
    toast('Notes enregistrées.');
  };
  document.getElementById('form-ligne').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tache = taches.find(t => t.id === fd.get('tache_id'));
    if (!tache) return toast('Choisissez une tâche.');
    const qte = Number(fd.get('quantite')||0);
    const tempsTotal = qte * Number(tache.temps_unitaire||0);
    const tauxVente = Number(state.entreprise.taux_horaire_defaut||0);
    const prixMO = tempsTotal * tauxVente;
    const prixConso = qte * Number(tache.qte_consommable||0) * Number(tache.cout_unitaire_conso||0);
    const { error } = await sb.from('devis_lignes').insert({
      devis_id: devis.id, tache_id: tache.id, code_tache: tache.code, designation: tache.intitule,
      quantite: qte, temps_unitaire: tache.temps_unitaire, temps_total: tempsTotal,
      prix_main_oeuvre: prixMO, prix_consommables: prixConso, total_ligne: prixMO + prixConso,
      ordre: (lignes||[]).length,
    });
    if (error) return toast('Erreur : ' + error.message);
    toast('Ligne ajoutée.'); renderDevisDetail(main, devis, taches);
  };
  detail.querySelectorAll('[data-del-ligne]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('devis_lignes').delete().eq('id', b.dataset.delLigne);
    if (error) return toast('Erreur : ' + error.message);
    toast('Ligne retirée.'); renderDevisDetail(main, devis, taches);
  });

  let dragSrcId = null;
  detail.querySelectorAll('[data-ligne-id]').forEach(row => {
    row.ondragstart = (e) => { dragSrcId = row.dataset.ligneId; e.dataTransfer.effectAllowed = 'move'; };
    row.ondragover = (e) => { e.preventDefault(); };
    row.ondrop = async (e) => {
      e.preventDefault();
      const targetId = row.dataset.ligneId;
      if (!dragSrcId || dragSrcId === targetId) return;
      const ids = (lignes||[]).map(l => l.id);
      const from = ids.indexOf(dragSrcId), to = ids.indexOf(targetId);
      if (from === -1 || to === -1) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      await Promise.all(ids.map((id, i) => sb.from('devis_lignes').update({ ordre: i }).eq('id', id)));
      renderDevisDetail(main, devis, taches);
    };
  });
}

function commandeClientStatutPill(s){
  const map = { 'Confirmee':['pill-ok','Confirmée'], 'En cours':['pill-warn','En cours'], 'Terminee':['pill-ok','Terminée'], 'Annulee':['pill-bad','Annulée'] };
  const [cls,label] = map[s] || ['pill-muted', s];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

// ---------- FACTURES ----------
function drawerFacture(main, commandesList, clients, preselectId){
  openDrawer('Nouvelle facture', `
    <form id="form-facture">
      <div class="form-grid">
        <div class="field"><label>Depuis une commande (optionnel)</label>
          <select name="commande_id" id="facture-commande-select">
            <option value="">— Facture manuelle —</option>
            ${(commandesList||[]).map(c => `<option value="${c.id}" ${c.id===preselectId?'selected':''}>${esc(c.numero)} — ${esc(c.client_nom||'—')}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Type</label>
          <select name="type"><option>Facture unique</option><option>Acompte</option><option>Solde</option></select>
        </div>
        <div class="field" id="facture-pct-field" hidden><label>% de la commande (acompte)</label><input name="pct_acompte" type="number" step="5" value="30"></div>
        <div class="field"><label>Client (si manuelle)</label>
          <select name="client_id"><option value="">— Client ponctuel —</option>${(clients||[]).map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Date émission</label><input name="date_emission" type="date" value="${todayISO()}"></div>
        <div class="field"><label>Date échéance</label><input name="date_echeance" type="date"></div>
      </div>
      <div class="drawer-foot" style="margin:18px -20px -18px"><button class="btn btn-ghost" type="button" id="facture-cancel">Annuler</button><button class="btn btn-primary" type="submit">Émettre</button></div>
    </form>`, () => {
  document.getElementById('facture-cancel').onclick = closeDrawer;
  const typeSelect = document.querySelector('#form-facture select[name="type"]');
  const pctField = document.getElementById('facture-pct-field');
  const syncPctVisible = () => { pctField.hidden = typeSelect.value !== 'Acompte'; };
  typeSelect.onchange = syncPctVisible; syncPctVisible();

  document.getElementById('form-facture').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const commandeId = fd.get('commande_id') || null;
    const type = fd.get('type');
    const commande = commandeId ? (commandesList||[]).find(c => c.id === commandeId) : null;

    let clientId = fd.get('client_id') || null;
    let clientNom = clientId ? (clients||[]).find(c=>c.id===clientId)?.nom : null;
    let numeroChantier = null;
    let tauxTva = Number(state.entreprise.taux_tva||0);
    let factureLignes = [];

    if (commande){
      clientId = commande.client_id; clientNom = commande.client_nom; numeroChantier = commande.numero_chantier;
      tauxTva = Number(commande.taux_tva||tauxTva);
      const { data: commandeLignes } = await sb.from('commandes_clients_lignes').select('*').eq('commande_id', commande.id);
      const totalHtCommande = (commandeLignes||[]).reduce((s,l)=>s+Number(l.total_ht||0),0);
      if (type === 'Facture unique'){
        factureLignes = (commandeLignes||[]).map(l => ({ designation: l.designation, quantite: l.quantite, prix_unitaire_ht: l.prix_unitaire_ht, taux_tva: tauxTva }));
      } else if (type === 'Acompte'){
        const pct = Number(fd.get('pct_acompte')||0);
        factureLignes = [{ designation: `Acompte sur commande ${commande.numero} (${pct}%)`, quantite: 1, prix_unitaire_ht: totalHtCommande * pct / 100, taux_tva: tauxTva }];
      } else if (type === 'Solde'){
        const { data: dejaFacture } = await sb.from('factures').select('montant_ht').eq('commande_id', commande.id).neq('type', 'Avoir');
        const dejaHT = (dejaFacture||[]).reduce((s,f)=>s+Number(f.montant_ht||0),0);
        factureLignes = [{ designation: `Solde sur commande ${commande.numero}`, quantite: 1, prix_unitaire_ht: totalHtCommande - dejaHT, taux_tva: tauxTva }];
      }
    }

    const { data: numero, error: numErr } = await sb.rpc('prochain_numero', { p_entreprise_id: state.entreprise.id, p_type: 'facture', p_prefixe: 'FA' });
    if (numErr) return toast('Erreur numérotation : ' + numErr.message);

    const totalHT = factureLignes.reduce((s,l)=>s+l.prix_unitaire_ht*l.quantite,0);
    const totalTVA = factureLignes.reduce((s,l)=>s+l.prix_unitaire_ht*l.quantite*Number(l.taux_tva||0)/100,0);

    const { data: facture, error } = await sb.from('factures').insert({
      entreprise_id: state.entreprise.id, numero_facture: numero, numero_chantier: numeroChantier,
      client_id: clientId, client_nom: clientNom, type, devis_id: commande?.devis_id||null, commande_id: commande?.id||null,
      date_emission: fd.get('date_emission')||todayISO(), date_echeance: fd.get('date_echeance')||null,
      montant_ht: totalHT, tva: totalTVA, montant_ttc: totalHT+totalTVA,
      conditions_paiement: state.entreprise.conditions_paiement||null,
    }).select().single();
    if (error) return toast('Erreur : ' + error.message);

    if (factureLignes.length){
      const { error: lignesErr } = await sb.from('factures_lignes').insert(
        factureLignes.map(l => ({ facture_id: facture.id, designation: l.designation, quantite: l.quantite, prix_unitaire_ht: l.prix_unitaire_ht, taux_tva: l.taux_tva, total_ht: l.prix_unitaire_ht*l.quantite }))
      );
      if (lignesErr) toast('Facture créée, erreur lignes : ' + lignesErr.message);
    }
    state.selectedFactureId = facture.id;
    closeDrawer(); toast('Facture émise.'); viewFactures(main);
  };
  });
}

async function viewFactures(main, term){
  const [{ data: factures }, { data: clients }, { data: commandesList }] = await Promise.all([
    sb.from('v_factures').select('*').eq('entreprise_id', state.entreprise.id).order('date_emission', { ascending:false }),
    sb.from('clients').select('*').eq('entreprise_id', state.entreprise.id).order('nom'),

  ]);
  const list = factures || [];
  const filtered = filterRows(list, term, ['numero_facture','client_nom','numero_chantier']);
  if (!state.selectedFactureId && list.length) state.selectedFactureId = list[0].id;
  const selected = list.find(f => f.id === state.selectedFactureId) || null;

  main.innerHTML = `
    <div class="view-head"><div><h1>Factures</h1><div class="view-sub">Numérotation légale séquentielle, lignes détaillées, acompte/solde, avoirs.</div></div></div>
    <div class="list-toolbar">
      <input class="search-input" id="factures-search" placeholder="Rechercher une facture, un client…" value="${esc(term||'')}">
      <button class="btn btn-primary btn-new" id="factures-new">${ICONS.plus} Nouvelle facture</button>
    </div>
    <div class="two-pane">
      <div class="pane-list">
        <h3 style="font-size:13px;margin-bottom:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.03em">Factures</h3>
        ${filtered.length ? filtered.map(f => `
          <div class="list-item${f.id===state.selectedFactureId?' active':''}">
            <button data-select-facture="${f.id}">
              <div><strong>${esc(f.numero_facture)}</strong> ${f.type==='Avoir'?'<span class="pill pill-bad">Avoir</span>':''}</div>
              <div class="meta">${esc(f.client_nom||'—')} · ${money(f.montant_ttc)} · ${factureStatutPill(f.statut)}</div>

  if (selected) await renderFactureDetail(selected);
}

          ${facture.statut!=='Payee' && facture.type!=='Avoir' ? `<button class="btn btn-ghost btn-sm" id="btn-pay-facture">Marquer payée</button>` : ''}
          ${facture.type!=='Avoir' ? `<button class="btn btn-ghost btn-sm" id="btn-avoir-facture">Générer un avoir</button>` : ''}

      </div>
      <div class="view-sub">Chantier ${esc(facture.numero_chantier||'—')} · Émise le ${esc(facture.date_emission)} · Échéance ${esc(facture.date_echeance||'—')} ${facture.date_echeance?echeancePill(facture.date_echeance):''} · ${esc(base?.conditions_paiement||'')}</div>
      <form id="form-facture-ligne" class="form-grid" style="margin:14px 0">
        <div class="field"><label>Désignation</label><input name="designation" required></div>
        <div class="field"><label>Quantité</label><input name="quantite" type="number" step="0.5" value="1" required></div>

        <div class="field"><button class="btn btn-ghost" type="submit">+ Ligne</button></div>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">PU HT</th><th class="num">TVA</th><th class="num">Total HT</th><th></th></tr></thead>
        <tbody>
          ${(lignes&&lignes.length) ? lignes.map(l => `
            <tr>
              <td>${esc(l.designation)}</td><td class="num">${num(l.quantite)}</td><td class="num">${money(l.prix_unitaire_ht)}</td>
              <td class="num">${num(l.taux_tva,1)}%</td><td class="num"><strong>${money(l.total_ht)}</strong></td>

          <tr><td colspan="4" style="text-align:right;font-weight:600">Total HT</td><td class="num" style="font-weight:700">${money(facture.montant_ht)}</td><td></td></tr>

    await sb.from('factures').update({ montant_ht: ht, tva, montant_ttc: ht+tva }).eq('id', facture.id);
  };

  const factureTypeLabel = facture.type==='Avoir' ? 'Avoir' : 'Facture';
  const docPourImpression = () => ({
    numero: facture.numero_facture, date: facture.date_emission, numeroChantier: facture.numero_chantier,

  if (avoirBtn) avoirBtn.onclick = async () => {
    if (!confirm(`Générer un avoir annulant ${facture.numero_facture} (${money(facture.montant_ttc)}) ?`)) return;
    const { data: numero, error: numErr } = await sb.rpc('prochain_numero', { p_entreprise_id: state.entreprise.id, p_type: 'avoir', p_prefixe: 'AV' });
    if (numErr) return toast('Erreur numérotation : ' + numErr.message);
    const { data: avoir, error } = await sb.from('factures').insert({
      entreprise_id: state.entreprise.id, numero_facture: numero, numero_chantier: facture.numero_chantier,
      client_id: base?.client_id||null, client_nom: facture.client_nom, type: 'Avoir',
      devis_id: base?.devis_id||null, facture_liee_id: facture.id,
      date_emission: todayISO(), montant_ht: -Number(facture.montant_ht||0), tva: -Number(facture.tva||0), montant_ttc: -Number(facture.montant_ttc||0),
    }).select().single();
    if (error) return toast('Erreur : ' + error.message);
    const { data: origLignes } = await sb.from('factures_lignes').select('*').eq('facture_id', facture.id);
    if (origLignes && origLignes.length){
      await sb.from('factures_lignes').insert(origLignes.map(l => ({
        facture_id: avoir.id, designation: `Avoir — ${l.designation}`, quantite: l.quantite,
        prix_unitaire_ht: -Number(l.prix_unitaire_ht||0), taux_tva: l.taux_tva, total_ht: -Number(l.total_ht||0),
      })));
    }
    state.selectedFactureId = avoir.id;
    toast('Avoir généré.'); viewFactures(document.getElementById('main'));
  };
}
function factureStatutPill(s){
  const map = { 'Payee':['pill-ok','Payée'], 'En retard':['pill-bad','En retard'], 'En attente':['pill-warn','En attente'] };
  const [cls,label] = map[s] || ['pill-muted', s];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

// ---------- PLANNING ----------
async function viewPlanning(main){
  const [{ data: interventions }, { data: employes }] = await Promise.all([
    sb.from('v_planning_semaine').select('*').eq('entreprise_id', state.entreprise.id),
    sb.from('employes').select('*').eq('entreprise_id', state.entreprise.id).eq('actif', true).order('nom'),
  ]);
  const list = interventions || [];
  const parJour = {};
  list.forEach(i => { const j = (i.date_debut||'').slice(0,10); (parJour[j] = parJour[j]||[]).push(i); });
  const jours = Object.keys(parJour).sort();
  main.innerHTML = `
    <div class="view-head"><div><h1>Planning</h1><div class="view-sub">Interventions des 14 prochains jours — qui va où, et quand.</div></div></div>
    <div class="card">
      <form id="form-intervention" class="form-grid">
        <div class="field"><label>Titre</label><input name="titre" required placeholder="Pose isolation combles"></div>
        <div class="field"><label>N° chantier</label><input name="numero_chantier"></div>
        <div class="field"><label>Salarié</label>
          <select name="employe_id"><option value="">—</option>${(employes||[]).map(e=>`<option value="${e.id}">${esc(e.nom)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Début</label><input name="date_debut" type="datetime-local" value="${nowLocalInput()}" required></div>
        <div class="field"><label>Fin</label><input name="date_fin" type="datetime-local" required></div>
        <div class="field"><button class="btn btn-primary" type="submit">+ Planifier</button></div>
      </form>
    </div>
    ${jours.length ? jours.map(j => `
      <div class="card">
        <h3>${esc(new Date(j).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Horaire</th><th>Titre</th><th>Chantier</th><th>Salarié</th><th>Statut</th><th></th></tr></thead>
          <tbody>
            ${parJour[j].map(i => `
              <tr>
                <td>${dt(i.date_debut).split(' ')[1]} – ${dt(i.date_fin).split(' ')[1]}</td>
                <td>${esc(i.titre)}</td><td>${esc(i.numero_chantier||'—')}</td><td>${esc(i.employe_nom||'—')}</td>
                <td>${interventionStatutPill(i.statut)}</td>
                <td><button class="btn btn-ghost btn-sm" data-del-intervention="${i.id}">×</button></td>
              </tr>`).join('')}
          </tbody>
        </table></div>
      </div>`).join('') : `<div class="card"><div class="view-sub">Aucune intervention planifiée sur les 14 prochains jours.</div></div>`}
  `;
  document.getElementById('form-intervention').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const emp = (employes||[]).find(x=>x.id===fd.get('employe_id'));
    const { error } = await sb.from('interventions').insert({
      entreprise_id: state.entreprise.id, titre: fd.get('titre'), numero_chantier: fd.get('numero_chantier')||null,
      employe_id: emp?.id||null, employe_nom: emp?.nom||null,
      date_debut: new Date(fd.get('date_debut')).toISOString(), date_fin: new Date(fd.get('date_fin')||fd.get('date_debut')).toISOString(),
    });
    if (error) return toast('Erreur : ' + error.message);
    toast('Intervention planifiée.'); viewPlanning(main);
  };
  main.querySelectorAll('[data-del-intervention]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('interventions').delete().eq('id', b.dataset.delIntervention);
    if (error) return toast('Erreur : ' + error.message);
    toast('Intervention retirée.'); viewPlanning(main);
  });
}
function interventionStatutPill(s){
  const cls = s==='Terminee' ? 'pill-ok' : s==='Annulee' ? 'pill-bad' : 'pill-warn';
  const label = {'Planifiee':'Planifiée','Terminee':'Terminée','Annulee':'Annulée'}[s] || (s||'—');
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

async function viewAchats(main, term){

    <div class="card">

        <tbody>${(fournisseurs&&fournisseurs.length) ? fournisseurs.map(f=>`<tr><td>${esc(f.nom)}</td><td>${esc(f.contact||'—')}</td><td>${esc(f.telephone||'—')}</td><td>${esc(f.email||'—')}</td></tr>`).join('') : emptyRow(4,'Aucun fournisseur.')}</tbody>
      </table></div>
    </div>
    <div class="list-toolbar">
      <input class="search-input" id="commandes-search" placeholder="Rechercher un bon de commande…" value="${esc(term||'')}">
      <button class="btn btn-primary btn-new" id="commande-new">${ICONS.plus} Nouveau bon de commande</button>
    </div>

      <div class="pane-list">

          <div class="list-item${c.id===state.selectedCommandeId?' active':''}">
            <button data-select-commande="${c.id}">
              <div><strong>${esc(c.numero||'BC')}</strong></div>
              <div class="meta">${esc(c.fournisseur_nom||'—')} · ${esc(c.date_commande)} · ${esc(c.statut)}</div>

      <div class="card-row"><h3 style="margin:0">Factures fournisseurs</h3><button class="btn btn-ghost btn-sm btn-new" id="facture-achat-new">${ICONS.plus} Nouvelle facture</button></div>
      <div class="view-sub" style="margin-bottom:10px">Ce qu'on doit payer — clôture le cycle Commande → Réception → Facture.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>N° fournisseur</th><th>Fournisseur</th><th>Date</th><th class="num">TTC</th><th>Statut</th><th></th></tr></thead>
        <tbody>

  detail.innerHTML = `
    <div class="card">
      <div class="card-row">
        <h3 style="margin:0">${esc(commande.numero||'Bon de commande')} — ${esc(commande.fournisseur_nom||'—')} ${commande.litige?'<span class="pill pill-bad">Litige</span>':''}</h3>

          <button class="btn btn-ghost btn-sm" id="commande-download" type="button">Télécharger PDF</button>
          <button class="btn btn-ghost btn-sm" id="commande-email" type="button">Envoyer par email</button>

        </div>
      </div>
      <form id="form-commande-ligne" class="form-grid" style="margin-bottom:14px">
        <div class="field"><label>Article stock (optionnel)</label>
          <select name="stock_id"><option value="">— libre —</option>${stockItems.map(s=>`<option value="${s.id}">${esc(s.designation)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Désignation</label><input name="designation" required></div>
        <div class="field"><label>Quantité</label><input name="quantite" type="number" step="1" value="1" required></div>

        <thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">PU</th><th class="num">Total</th><th>Reçue</th><th></th></tr></thead>
        <tbody>

            <tr>
              <td>${esc(l.designation)}</td><td class="num">${num(l.quantite)}</td><td class="num">${money(l.prix_unitaire)}</td><td class="num">${money(l.total)}</td>

    const fd = new FormData(e.target);
    const qte = Number(fd.get('quantite')||1), pu = Number(fd.get('prix_unitaire')||0);
    const stockId = fd.get('stock_id') || null;
    const designation = fd.get('designation') || (stockItems.find(s=>s.id===stockId)?.designation) || '—';
    const { error } = await sb.from('commandes_fournisseurs_lignes').insert({ commande_id: commande.id, stock_id: stockId, designation, quantite: qte, prix_unitaire: pu, total: qte*pu });
    if (error) return toast('Erreur : ' + error.message);
    toast('Ligne ajoutée.'); renderCommandeDetail(main, commande, stockItems, fournisseurs, commandes);
  };
  detail.querySelectorAll('[data-del-commande-ligne]').forEach(b => b.onclick = async () => {
    await sb.from('commandes_fournisseurs_lignes').delete().eq('id', b.dataset.delCommandeLigne);

    if (ligne.stock_id){
      const { data: art } = await sb.from('stock').select('quantite').eq('id', ligne.stock_id).single();
      if (art) await sb.from('stock').update({ quantite: Number(art.quantite||0) + Number(ligne.quantite||0) }).eq('id', ligne.stock_id);
    }
    toast('Ligne reçue — stock mis à jour.'); renderCommandeDetail(main, commande, stockItems, fournisseurs, commandes);
  });
  document.getElementById('commande-facturer').onclick = () => drawerFactureAchat(main, fournisseurs, commandes, commande.id);
}
